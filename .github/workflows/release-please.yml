on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  # Shared workflow: the pinned release-please SHA is maintained in
  # chenwei791129/.github for every repository.
  release-please:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: chenwei791129/.github/.github/workflows/release-please.yml@main
    with:
      release-type: go

  # Call the shared build workflow
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/build.yml

  # Download the artifact and upload it to the release
  upload-release-asset:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Binary Artifact
        uses: actions/download-artifact@v8
        with:
          name: multiablo-binary
          
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} multiablo.exe --clobber